name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds existing code without waiting
    # for someone to push.
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse C#
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      # Built explicitly rather than by autobuild, so CodeQL sees the same
      # compilation the normal build produces.
      - name: Build
        run: |
          dotnet restore Panelith.slnx --locked-mode
          dotnet build Panelith.slnx --configuration Release --no-restore
        shell: pwsh

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:csharp
