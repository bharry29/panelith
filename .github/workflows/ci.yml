name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      # Pinned by commit, not by tag: a tag can be moved to point at different
      # code, and these actions run with access to the checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Locked mode is what makes the committed lock files mean anything: restore
      # fails rather than quietly resolving to a package nobody reviewed.
      - name: Restore
        run: dotnet restore Panelith.slnx --locked-mode

      # Warnings are errors, so this fails on anything the local build would catch.
      - name: Build
        run: dotnet build Panelith.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Panelith.slnx --configuration Release --no-restore

      # The same check build/publish.ps1 makes before it will produce an installer.
      - name: Check dependencies for known vulnerabilities
        run: |
          $audit = dotnet list Panelith.slnx package --vulnerable --include-transitive
          $audit
          if ($audit -match 'has the following vulnerable packages') { exit 1 }
        shell: pwsh
